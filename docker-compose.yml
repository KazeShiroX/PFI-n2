services:
  auth:
    build: ./auth-service
    ports:
      - "8001:8000"
    env_file: .env
    networks:
      - banco_network

  core:
    build: ./core-bancario
    ports:
      - "8081:8080"
    env_file: .env
    networks:
      - banco_network
    depends_on:
      - auth
      - mqtt

  mqtt:
    build: ./mqtt-service
    ports:
      - "1883:1883"
      - "9000:9000"
    env_file: .env
    networks:
      - banco_network

networks:
  banco_network:
    external: true
    name: banco_network
